template:
  - binary_sensor:
      - name: "PAC State 0"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(1) > 0 }}
      - name: "PAC State 1"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(2) > 0 }}
      - name: "PAC State 2"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(4) > 0 }}
      - name: "PAC State 3"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(8) > 0 }}
      - name: "PAC State 4"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(16) > 0 }}
      - name: "PAC State 5"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(32) > 0 }}
      - name: "PAC State 6"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(64) > 0 }}
      - name: "PAC State 7"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(128) > 0 }}
      - name: "PAC State 8"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(256) > 0 }}
      - name: "PAC State 9"
        state: >
          {{ states('sensor.pac_state') | int | bitwise_and(512) > 0 }}
      - name: "PAC Address 1023 derivative positive"
        state: >
          {{ states('sensor.pac_address_1023_derivative') | float(0) > 0 }}
        delay_on:
          minutes: 2
        delay_off:
          minutes: 2

  # Test SEY with templated sensor (01-09-2025)
  - sensor:
      - name: "Total Water Consumption Test"
        unit_of_measurement: "m³"
        state: none
        device_class: water
        state_class: total

  #### Tracking time TV watching
  - sensor:
      - name: "Time TV watching"
        state: >
          {% if is_state('media_player.shield_2', 'on') %}
            {{ relative_time(states.media_player.shield_2.last_updated) }}
          {% endif %}

rest_command:
  notify_lametric:
    url: "http://192.168.1.10:8080/api/v2/widget/update/com.lametric.diy.devwidget/e2bbb2bb48d0499db222e82266893326"
    method: "post"
    username: !secret lametric_username
    password: !secret lametric_password
    content_type: "application/json"
    payload: '{ "frames" : [ { "icon": "{{ icon }}", "text" : "{{ text }}" } ] }'
