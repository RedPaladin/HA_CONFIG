# Loads default set of integrations. Do not remove
default_config:

homeassistant:
  packages: !include_dir_named packages/
  media_dirs:
    local: /media
    www: /config/www

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/community/custom-brand-icons/custom-brand-icons.js

#################################################################
## Includes
#################################################################
group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

modbus: # https://www.home-assistant.io/integrations/modbus/
  - type: tcp
    host: !secret modbus_heatpump_ip
    port: 502
    name: "modbus_pac"
    delay: 1 # time to delay sending messages in seconds after connecting
    message_wait_milliseconds: 100
    timeout: 10
    sensors:
      - name: "PAC External Temperature"
        address: 1003 # address -1 compare to the modbus register map (mbpoll)
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
      - name: "PAC Temperature ECS"
        address: 1001
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
      - name: "PAC Circuit Temperature"
        address: 1004
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
      - name: "PAC State"
        address: 1021
        input_type: holding
        data_type: int16

      # PAC registers 1001-1114
